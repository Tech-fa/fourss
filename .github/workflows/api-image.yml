name: API image

on:
  push:
    branches: [main]
    paths:
      - documents_backend/**
      - desktop-shell/deploy/api.Dockerfile
      - .github/workflows/api-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: techfa22
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read the API version
        id: version
        run: echo "version=$(node -p "require('./documents_backend/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop-shell/deploy/api.Dockerfile
          push: true
          tags: |
            techfa22/fourss-api:latest
            techfa22/fourss-api:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=fourss-api
          cache-to: type=gha,scope=fourss-api,mode=max
