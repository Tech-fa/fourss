name: Website image

on:
  push:
    branches: [main]
    paths:
      - web_dashboard/**
      - deploy/ui.Dockerfile
      - deploy/nginx.conf
      - deploy/ui-config.json
      - .github/workflows/ui-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: techfa22
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read the website version
        id: version
        run: echo "version=$(node -p "require('./web_dashboard/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ui.Dockerfile
          push: true
          tags: |
            techfa22/fourss-ui:latest
            techfa22/fourss-ui:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=fourss-ui
          cache-to: type=gha,scope=fourss-ui,mode=max
